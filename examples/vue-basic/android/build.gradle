buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// The Detox wiring this file used to carry belongs with NX-010, the Detox e2e
// harness. It applied a Gradle script out of a package the app does not depend
// on and pointed a Maven repository at an AAR nothing resolves, so a freshly
// scaffolded app could not build for Android at all.
apply plugin: "com.facebook.react.rootproject"
