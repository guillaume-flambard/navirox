# Navirox workspace members.
#
# `packages/*` are ours. `examples/*` are members too, and that is a deliberate
# departure from the note this file used to carry: the examples consume
# `@memolabs-apps/*` through `workspace:*`, because those packages are not published
# yet and a `workspace:` range is what makes an example resolve the code in this
# repo rather than a registry that has nothing to give. Upstream SymbioteNative
# can keep its examples standalone precisely because its packages ARE published.
# Once Navirox publishes, the examples move back onto the consumer path.
packages:
  - 'packages/*'
  - 'examples/*'

# One React and one React Native for the whole tree. Metro bundles whatever it
# finds on disk, so a second copy of either means two reconcilers and a native
# module registry that does not match the loaded runtime. The renderer adapter
# also declares `react-native` as an optional peer, and pnpm is happy to satisfy
# that with a different minor than the apps use, which is exactly how the second
# copy appeared the first time.
overrides:
  react: 19.2.3
  react-native: 0.86.0
  # A medium advisory sits on fast-xml-parser below 5.7.0, and the React Native
  # CLI declares ^4.4.1, so the only place the fix can come from is here. The
  # declaration is only the Android build tooling reading the app's own
  # AndroidManifest.xml, the vulnerable code is in XMLBuilder which that path
  # never calls, and 5.x still exports the XMLParser it does call. Checked by
  # running the CLI config command after the bump, not by reading a changelog.
  fast-xml-parser: ^5.7.0
  # Detox brings stream-json through its reporting stack. An override to 3.5.0
  # was tried here to close the denial-of-service advisory in the JSON filters,
  # and it cannot work: 3.5.0 is an ESM package whose jsonl parser moved to
  # src/jsonl/parser.js and exports a factory, while detox requires
  # `stream-json/jsonl/Parser` and calls `JsonlParser.make(...)`. Every
  # `detox build` therefore died on MODULE_NOT_FOUND before any native code ran.
  # detox 20.51.4 and bunyamin 1.6.3 both declare the 1.x line, so the tree
  # resolves 1.9.1, and the advisory (GHSA-528h-pc64-c93x, medium, the
  # pick/ignore/filter/replace filters only, reached by detox's own device log
  # parsing) is accepted until detox moves to the 3.x API. Nothing Navirox ships
  # depends on stream-json.

minimumReleaseAgeExclude:
  - '@vue/compiler-core@3.5.43'
  - '@vue/compiler-dom@3.5.43'
  - '@vue/compiler-sfc@3.5.43'
  - '@vue/compiler-ssr@3.5.43'
  - '@vue/reactivity@3.5.43'
  - '@vue/runtime-core@3.5.43'
  - '@vue/runtime-dom@3.5.43'
  - '@vue/server-renderer@3.5.43'
  - '@vue/shared@3.5.43'
  - vue@3.5.43

# Metro's file-watching fallback can compile a native watcher, but this machine
# already runs watchman, so the compile is dead weight. Declaring it explicitly
# settled is also what stops pnpm from writing its own placeholder value here and
# then failing every install, because a placeholder is not a boolean.
allowBuilds:
  '@parcel/watcher': false
  # Detox's postinstall builds the local iOS framework and the XCUITest runner,
  # then patches its Android build to the app's RN version. The e2e harness needs
  # both. It is a no-op off darwin, so Linux CI is unaffected.
  detox: true
  # bunyan's optional dtrace provider compiles a native node-gyp module that the
  # logger already treats as optional; skipping the compile loses nothing.
  dtrace-provider: false
  # The resolver's postinstall only wires up the prebuilt platform binding.
  unrs-resolver: true
