version: 2
updates:
  # One npm entry at the root is enough: the workspace has a single lockfile and
  # every package in it is resolved from there.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A release is not trustworthy the hour it lands. A compromised version gets
    # noticed and yanked quickly, so the window right after a publish is when an
    # automated bump is most dangerous, and it is also when nobody has run the
    # version yet. Waiting a week costs nothing and closes both windows.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Types and the lint stack move together. Reviewing them one by one is
      # noise, and they are safe to land as a single pull request.
      types:
        patterns:
          - '@types/*'
      lint-and-format:
        patterns:
          - 'eslint*'
          - 'typescript-eslint'
          - 'prettier'
          - '@changesets/*'
    ignore:
      # The Symbiote packages are pinned exactly on purpose, see AGENTS.md. Their
      # version lines move independently and a floating range once produced a pod
      # install failure. Bumping them is a deliberate act, not a bot's.
      - dependency-name: '@symbiote-native/*'
      # TypeScript is pinned to ~6.0.3 because typescript-eslint@8 declares a
      # peer of <6.1.0. A minor bump is as likely to break the lint stack as a
      # major one, so both are held back.
      - dependency-name: typescript
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # React Native's own internals have to match the react-native version
      # exactly. A codegen newer than the vendored react-native is the failure
      # AGENTS.md records, and it surfaces at pod install rather than in CI.
      - dependency-name: '@react-native/*'
      - dependency-name: '@react-native-community/*'
      # The Babel line moves with React Native, so a major here is a coordinated
      # change rather than a pull request to merge on a Monday.
      - dependency-name: '@babel/*'
        update-types:
          - version-update:semver-major
      # One reconciler, one renderer. Both versions live in the workspace
      # overrides, which is not a file Dependabot can edit, so a pull request
      # that raised only the declaration would be a change the lockfile ignores.
      - dependency-name: react
      - dependency-name: react-native
      # Every name below appears only in a fixture manifest, never in the
      # workspace. `exclude-paths` below keeps the version updates away from
      # those manifests, but it does not cover security updates: the options
      # reference marks each option that also changes how security updates are
      # handled, and `exclude-paths` carries no such mark. So an advisory on one
      # of these names still starts an update job on a manifest nothing
      # installs, and the job fails with `dependency_file_not_supported`
      # because Dependabot cannot tell which version is in use without a
      # lockfile. The run history shows exactly that on next ^13.0.0 and, after
      # the Astro adapter landed with its own deliberately old fixture, on
      # astro ^4.0.0.
      #
      # The list names every framework a fixture declares, not only the names
      # an advisory happens to cover today, because the next advisory picks the
      # name the scanner finds rather than the one that was reported last time.
      #
      # If one of these names ever becomes a real dependency, remove it from
      # this list rather than leaving a security update switched off.
      - dependency-name: astro
      - dependency-name: '@astrojs/*'
      - dependency-name: next
      - dependency-name: react-dom
      - dependency-name: react-router-dom
      - dependency-name: '@angular/*'
      - dependency-name: svelte
      - dependency-name: '@sveltejs/*'
      - dependency-name: svelte-check
      - dependency-name: nuxt
      - dependency-name: solid-js
      - dependency-name: '@solidjs/*'
      - dependency-name: zustand
      - dependency-name: rxjs
      - dependency-name: tslib
      - dependency-name: vite
    # The fixture manifests under a package are inputs to a source adapter, not
    # projects. They are outside the workspace on purpose, two of them declare
    # versions an adapter has to report as untested, and a bot that "updated" a
    # fixture would quietly delete the evidence it exists to provide. This list
    # only reaches version updates, which is why the `ignore` entries above
    # exist as well.
    exclude-paths:
      - 'packages/*/fixtures/**'
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'

  # The actions in .github/workflows. Nothing was watching them until the Node 20
  # deprecation warning showed up, which is exactly what this entry prevents.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'ci(deps)'
