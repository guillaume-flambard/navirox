name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install / build / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads `packageManager` from package.json, so CI uses the same pnpm
      # version as every developer and the lockfile stays stable.
      - uses: pnpm/action-setup@v6

      # Node 24 is what this project is developed and verified against. The
      # `engines` floor in package.json stays where upstream puts it, because
      # that floor is a promise to consumers rather than a target for us.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm deps:check
