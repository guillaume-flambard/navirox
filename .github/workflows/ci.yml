name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository, so the token should not be able to.
# Without this the job inherits whatever the repository default is, which is
# wider than this workflow needs.
permissions:
  contents: read

jobs:
  verify:
    name: install / build / typecheck / test
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit rather than a tag, with the version kept
      # beside it as a comment so a reader still knows what they are looking at.
      # A tag is a moving target: whoever controls the action can point it at new
      # code, and the next run executes it unreviewed. Dependabot understands
      # this form and opens a pull request to move the pin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The changeset check below compares against the commit this branch
          # forked from, so the whole history has to be here. The default
          # shallow clone fetches one commit and the comparison has nothing to
          # compare against.
          fetch-depth: 0

      # Reads `packageManager` from package.json, so CI uses the same pnpm
      # version as every developer and the lockfile stays stable.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node 24 is what this project is developed and verified against. The
      # `engines` floor in package.json stays where upstream puts it, because
      # that floor is a promise to consumers rather than a target for us.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `CONTRIBUTING.md` has asked for a changeset since the monorepo existed, and until this
      # release nothing executed that instruction. The rule is about packages changing, so it is
      # checked against the commit the pull request targets. `changeset status --since` exits 1
      # with the remedy in its message when a package changed and no changeset explains it, and
      # exits 0 when no package changed at all, so a change to docs, workflows or PLAN.md on its
      # own passes. Pull requests only: on a push to main there is no base to compare against.
      #
      # The base travels through `env` rather than being interpolated into the shell, because a
      # `${{ }}` expression inside `run` is exactly what zizmor's template-injection rule flags.
      - name: Require a changeset for a change to a package
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm changeset status --since="$BASE_SHA"

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      # The root `lint` script is a single `eslint "packages/*/src/**/*.ts"` call, so it never
      # reads the example's own `eslint.config.js`. That config was broken for a long time
      # without anyone noticing, precisely because nothing executed it. Linting the example
      # from its own directory makes ESLint find and load that config.
      - run: pnpm --filter vue-basic lint
      - run: pnpm format:check
      - run: pnpm deps:check

  e2e:
    name: scaffold, install and build for Android
    runs-on: ubuntu-latest
    steps:
      # Same pins as the job above, for the same reason: a tag is a moving target.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      # The scaffolded app is a React Native project, so its Android build wants
      # the JDK that framework documents rather than whichever one the image
      # happens to ship.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Scaffolds into a temporary directory, installs the app there, checks the
      # linked packages and the help text, bundles both platforms with Metro, then
      # builds the Android app. This is the only check that runs a scaffolded app
      # for real, and it exists because four scaffolder faults were invisible
      # until an app was installed. The bundle runs first and is the cheap half of
      # it: Metro needs no native toolchain and takes seconds, while compiling
      # native code never runs Metro at all, which is how the template once shipped
      # without the package the SFC transform writes into every component.
      - run: node scripts/e2e-scaffold.mjs --bundle --build android

  e2e-ios:
    name: scaffold, install and build for iOS
    # A macOS runner costs several times a Linux one and the build takes minutes,
    # so iOS is verified on main and on demand rather than on every pull request.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      # Same pins as the verify job, for the same reason.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      # CocoaPods turns the app's Podfile into the workspace the build needs, and
      # the runner images do not always ship a usable one.
      - run: pod --version || sudo gem install cocoapods --no-document

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/e2e-scaffold.mjs --build ios

  journey-android:
    name: run ${{ matrix.app }} journey on an emulator
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [vue-basic, vue-pilot]
    env:
      NAVIROX_E2E_APP: ${{ matrix.app }}
    # The step that boots the emulator has no timeout of its own and the default
    # job timeout is six hours, so an emulator that hangs mid-boot costs a
    # runner for the afternoon instead of failing in the time a journey takes.
    timeout-minutes: 30
    steps:
      # Same pins as the verify job, for the same reason.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # A hosted runner has /dev/kvm but the runner user is not in its group, and
      # the emulator without acceleration is worse than slow: it never finishes
      # booting. The action notices, sets `-accel off`, and the run dies on
      # `Can't find service: package` while adb already lists the device. This is
      # the recipe from the action's own README, and the reason it recommends an
      # Ubuntu runner over a macOS one.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The journey drives an app that is already built: `detox test` installs
      # and runs a binary, it does not compile one. Building here rather than
      # inside the emulator step also keeps the emulator step to the run itself,
      # which is the part that can hang.
      - run: pnpm --filter "$NAVIROX_E2E_APP" e2e:build:android

      # This job owns the emulator end to end rather than handing it to the
      # maintained helper action, which is deliberate. That action deadlocks
      # after the tests pass: it kills the emulator, then waits on the whole
      # process tree, and the emulator's own crash-handler children never exit
      # (ReactiveCircus/android-emulator-runner#385, open since 2024 and still
      # reproducing as of this writing). The suite goes green and the job hangs
      # anyway, and no later step can clean up, because the hung step holds the
      # workflow until the job timeout. Booting the emulator here means nothing
      # waits on something we do not control, and the teardown below is a trap
      # that runs whatever the tests did.
      #
      # Owning it also means owning every wait in it. The first version of this
      # step copied the obvious `adb wait-for-device` idiom and then sat silent
      # for twenty-four minutes when the emulator never came up, because that
      # command has no timeout and no opinion about an emulator that died on the
      # way. It is replaced below with a bounded poll on an explicit serial,
      # which is what the helper action does internally for the same reason.
      #
      # The profile is load-bearing rather than cosmetic: both the canary and
      # the migrated pilot use a fixed column whose list takes the height the
      # card leaves. A small AVD starves the list to zero height, so a phone-
      # sized AVD is part of the setup rather than an incidental CI detail.
      - name: Run the journey against the emulator
        env:
          NAVIROX_ANDROID_AVD: navirox-e2e
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          # Where the AVD lives is the one thing that has to be pinned here.
          # `avdmanager` and `emulator` do not resolve the AVD home from the
          # same variable: the SDK tools read ANDROID_USER_HOME, while the
          # emulator reads ANDROID_AVD_HOME and only falls back to the SDK
          # paths. The runner image already sets one of them, and the result is
          # an AVD that is created without complaint and then does not exist as
          # far as the emulator is concerned ("Unknown AVD name
          # [navirox-e2e]"), which is what an earlier version of this step was
          # really waiting on. Both tools are pointed at one directory we own.
          export ANDROID_USER_HOME="${RUNNER_TEMP:-/tmp}/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          unset ANDROID_SDK_HOME || true
          mkdir -p "$ANDROID_AVD_HOME"

          SERIAL=emulator-5554

          # The trap is the teardown for every outcome below. Killing qemu and
          # the crash handler with -9 is what makes the step end: a polite
          # shutdown leaves the handler behind, and this shell is the only
          # process left to notice. Even the polite attempt is capped, because
          # it is adb talking to a device that may already be gone.
          teardown() {
            timeout 20 adb -s "$SERIAL" emu kill > /dev/null 2>&1 || true
            sleep 5
            pkill -9 -f qemu-system || true
            pkill -9 -f crashpad_handler || true
          }
          trap teardown EXIT

          # An emulator that never comes up is the failure worth reading about,
          # so every failing path prints what the emulator itself said. Without
          # this the diagnosis is the one thing missing.
          fail() {
            echo "::error::$1"
            echo "--- avd home ---"
            ls -la "$ANDROID_AVD_HOME" 2>/dev/null || true
            avdmanager list avd 2>/dev/null || true
            echo "--- adb devices ---"
            adb devices || true
            echo "--- emulator log (tail) ---"
            tail -n 80 /tmp/emulator.log 2>/dev/null || echo "(no emulator log)"
            exit 1
          }

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64" > /dev/null
          echo no | avdmanager create avd --force -n "$NAVIROX_ANDROID_AVD" \
            --package "system-images;android-35;google_apis;x86_64" --device pixel_7
          # `avdmanager` writes a `<name>.ini` pointer next to the `<name>.avd`
          # directory, and that pointer is what the emulator resolves. Checking
          # it here beats discovering it four minutes into a boot poll.
          [ -f "$ANDROID_AVD_HOME/$NAVIROX_ANDROID_AVD.ini" ] ||
            fail "avdmanager did not write the AVD where the emulator looks"

          adb start-server

          # Output goes to a file so the emulator does not hold the step's pipe
          # open, and it outlives this shell only until the trap above. The port
          # is pinned rather than left to chance, so the serial below is a fact
          # and not a guess.
          emulator -avd "$NAVIROX_ANDROID_AVD" -port 5554 -no-window -gpu swiftshader_indirect \
            -no-snapshot -noaudio -no-boot-anim > /tmp/emulator.log 2>&1 &

          booted=false
          for _ in $(seq 1 120); do
            if [ "$(timeout 20 adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=true
              break
            fi
            sleep 2
          done
          [ "$booted" = true ] || fail "the emulator did not finish booting in four minutes"

          # A headless emulator lets its display sleep on the system timeout, and
          # a window whose screen is off never takes window focus, which is the
          # one thing Espresso insists on: "Waited for the root of the view
          # hierarchy to have window focus and not request layout for 10
          # seconds". The app was mounted and idle when that happened, so focus
          # was the whole failure and it was timing, not code. Stay awake, wake
          # the display, drop the keyguard, and push the screen timeout well
          # past the length of a run.
          adb -s "$SERIAL" shell svc power stayon true
          adb -s "$SERIAL" shell input keyevent 224
          adb -s "$SERIAL" shell wm dismiss-keyguard
          adb -s "$SERIAL" shell settings put system screen_off_timeout 1800000

          adb -s "$SERIAL" shell settings put global window_animation_scale 0
          adb -s "$SERIAL" shell settings put global transition_animation_scale 0
          adb -s "$SERIAL" shell settings put global animator_duration_scale 0

          pnpm --filter "$NAVIROX_E2E_APP" e2e:test:android || fail "the $NAVIROX_E2E_APP journey failed on the emulator"

  journey-ios:
    name: run ${{ matrix.app }} journey on a simulator
    # Same reasoning as the iOS build job above: a macOS runner costs several
    # times a Linux one, so the journey is verified on main and on demand.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app: [vue-basic, vue-pilot]
    env:
      NAVIROX_E2E_APP: ${{ matrix.app }}
    # The first launch on a fresh runner boots a simulator, installs the app and
    # builds a Metro bundle from an empty cache, which is minutes before the first
    # assertion. Without a cap, a stuck simulator waits out the six-hour default.
    timeout-minutes: 45
    steps:
      # Same pins as the verify job, for the same reason.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      # Detox reaches into the simulator through applesimutils, which is not in
      # the runner image. Without it the suite dies before the first test with a
      # bare "applesimutils: command not found", which reads like a Detox fault
      # and is not one. It lives in the Wix tap, which Homebrew refuses to load
      # until it is trusted.
      - run: brew tap wix/brew && brew trust wix/brew && brew install applesimutils

      - run: pod --version || sudo gem install cocoapods --no-document

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Pods are not committed, and adding a devDependency is enough to move the
      # lock the build checks the manifest against.
      - run: |
          cd "examples/$NAVIROX_E2E_APP/ios"
          pod install

      - run: pnpm --filter "$NAVIROX_E2E_APP" e2e:build:ios
      - run: pnpm --filter "$NAVIROX_E2E_APP" e2e:test:ios

  capture-ios:
    name: capture the records fixture on a simulator
    # Same reasoning as the other macOS jobs: the runner costs several times a
    # Linux one, so the capture is verified on main and on demand.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    # The capture builds the application it captures and installs it on a
    # simulator, which is minutes before the first screenshot and much longer
    # than the journey, which starts from an already built binary.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      # Same two tools as the iOS journey job, for the same reasons: Detox
      # reaches the simulator through applesimutils, and the capture prepares
      # the application's Pods with CocoaPods before it builds.
      - run: brew tap wix/brew && brew trust wix/brew && brew install applesimutils

      - run: pod --version || sudo gem install cocoapods --no-document

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The workspace is named so the upload below knows what to upload before
      # the run starts. A temporary directory would be a path the workflow cannot
      # name, and uploading the whole workspace would upload a node_modules.
      # The device is named explicitly because the harness default is a local
      # machine's simulator and a runner's simulator list is its own.
      - run: node packages/visual-benchmark/scripts/capture-records-native.mjs --platform ios --workspace "$RUNNER_TEMP/capture-ios"
        env:
          NAVIROX_DEVICE: iPhone 17

      # The proof companion's own scenario. It drives the screen the target
      # compiler emitted for the field-workflow fixture, which imports the two
      # units the planner approved as shared, so this run also proves the
      # preparation copies them beside the app root.
      - run: node packages/visual-benchmark/scripts/capture-records-native.mjs --platform ios --scenario field-workflow --workspace "$RUNNER_TEMP/capture-field-workflow-ios"
        env:
          NAVIROX_DEVICE: iPhone 17

      # The captures are the point of the job, so they are kept whether the run
      # passed or failed. A failed run is exactly when the screenshot is worth
      # looking at.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: records-native-capture-ios
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/capture-ios/app/scenario-artifacts
            ${{ runner.temp }}/capture-field-workflow-ios/app/scenario-artifacts
            docs/evidence/records-native-capture-*.json
            docs/evidence/native-capture-*.json

  capture-android:
    name: capture the records fixture on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # The capture builds the application's APK with Gradle, and Gradle's first
      # act is to download its own distribution. That download is the flakiest
      # thing in this workflow: services.gradle.org answered a transient 504 for
      # gradle-9.3.1-bin.zip twice inside one run and killed both Android jobs
      # before either of them compiled a line. The distribution and the
      # dependency cache are keyed on the wrapper properties, so a Gradle version
      # change starts a fresh cache instead of restoring one that no longer fits.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The setup below is the journey job's setup, repeated rather than shared.
      # It cannot be a composite action: the teardown trap has to live in the
      # shell that owns the emulator, because that trap is what ends the step
      # when a run hangs, and a composite action's step would tear the emulator
      # down before the capture had run. The capture needs the same emulator, so
      # it needs the same setup in its own step.
      - name: Run the native capture against the emulator
        env:
          NAVIROX_ANDROID_AVD: navirox-e2e
          # The harness reads NAVIROX_DEVICE first and falls back to the AVD
          # variable above, so naming it here keeps the two jobs symmetric.
          NAVIROX_DEVICE: navirox-e2e
          # The web half of the run screenshots the served page, and a Linux
          # runner installs the browser as a command rather than an application
          # bundle.
          NAVIROX_CHROME: /usr/bin/google-chrome
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          # Where the AVD lives is the one thing that has to be pinned here.
          # `avdmanager` and `emulator` do not resolve the AVD home from the
          # same variable: the SDK tools read ANDROID_USER_HOME, while the
          # emulator reads ANDROID_AVD_HOME and only falls back to the SDK
          # paths. Both tools are pointed at one directory we own.
          export ANDROID_USER_HOME="${RUNNER_TEMP:-/tmp}/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          unset ANDROID_SDK_HOME || true
          mkdir -p "$ANDROID_AVD_HOME"

          SERIAL=emulator-5554

          # The trap is the teardown for every outcome below. Killing qemu and
          # the crash handler with -9 is what makes the step end: a polite
          # shutdown leaves the handler behind, and this shell is the only
          # process left to notice.
          teardown() {
            timeout 20 adb -s "$SERIAL" emu kill > /dev/null 2>&1 || true
            sleep 5
            pkill -9 -f qemu-system || true
            pkill -9 -f crashpad_handler || true
          }
          trap teardown EXIT

          # An emulator that never comes up is the failure worth reading about,
          # so every failing path prints what the emulator itself said.
          fail() {
            echo "::error::$1"
            echo "--- avd home ---"
            ls -la "$ANDROID_AVD_HOME" 2>/dev/null || true
            avdmanager list avd 2>/dev/null || true
            echo "--- adb devices ---"
            adb devices || true
            echo "--- emulator log (tail) ---"
            tail -n 80 /tmp/emulator.log 2>/dev/null || echo "(no emulator log)"
            exit 1
          }

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64" > /dev/null
          echo no | avdmanager create avd --force -n "$NAVIROX_ANDROID_AVD" \
            --package "system-images;android-35;google_apis;x86_64" --device pixel_7
          # `avdmanager` writes a `<name>.ini` pointer next to the `<name>.avd`
          # directory, and that pointer is what the emulator resolves. Checking
          # it here beats discovering it four minutes into a boot poll.
          [ -f "$ANDROID_AVD_HOME/$NAVIROX_ANDROID_AVD.ini" ] ||
            fail "avdmanager did not write the AVD where the emulator looks"

          adb start-server

          # Output goes to a file so the emulator does not hold the step's pipe
          # open, and it outlives this shell only until the trap above. The port
          # is pinned rather than left to chance, so the serial below is a fact
          # and not a guess.
          emulator -avd "$NAVIROX_ANDROID_AVD" -port 5554 -no-window -gpu swiftshader_indirect \
            -no-snapshot -noaudio -no-boot-anim > /tmp/emulator.log 2>&1 &

          booted=false
          for _ in $(seq 1 120); do
            if [ "$(timeout 20 adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=true
              break
            fi
            sleep 2
          done
          [ "$booted" = true ] || fail "the emulator did not finish booting in four minutes"

          # A headless emulator lets its display sleep on the system timeout, and
          # a window whose screen is off never takes window focus, which is the
          # one thing Espresso insists on. Stay awake, wake the display, drop the
          # keyguard, and push the screen timeout past the length of a run.
          adb -s "$SERIAL" shell svc power stayon true
          adb -s "$SERIAL" shell input keyevent 224
          adb -s "$SERIAL" shell wm dismiss-keyguard
          adb -s "$SERIAL" shell settings put system screen_off_timeout 1800000

          adb -s "$SERIAL" shell settings put global window_animation_scale 0
          adb -s "$SERIAL" shell settings put global transition_animation_scale 0
          adb -s "$SERIAL" shell settings put global animator_duration_scale 0

          node packages/visual-benchmark/scripts/capture-records-native.mjs \
            --platform android --workspace "$RUNNER_TEMP/capture-android" ||
            fail "the native capture failed on the emulator"

          # The proof companion's own scenario, driven on the same emulator. A
          # second application is prepared because the scenario belongs to a
          # different fixture, and the emulator is already awake.
          node packages/visual-benchmark/scripts/capture-records-native.mjs \
            --platform android --scenario field-workflow \
            --workspace "$RUNNER_TEMP/capture-field-workflow-android" ||
            fail "the field-workflow capture failed on the emulator"

      # Same reasoning as the iOS capture: the captures are the point of the job,
      # so they are kept whether the run passed or failed.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: records-native-capture-android
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/capture-android/app/scenario-artifacts
            ${{ runner.temp }}/capture-field-workflow-android/app/scenario-artifacts
            docs/evidence/records-native-capture-*.json
            docs/evidence/native-capture-*.json
