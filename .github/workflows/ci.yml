name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository, so the token should not be able to.
# Without this the job inherits whatever the repository default is, which is
# wider than this workflow needs.
permissions:
  contents: read

jobs:
  verify:
    name: install / build / typecheck / test
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit rather than a tag, with the version kept
      # beside it as a comment so a reader still knows what they are looking at.
      # A tag is a moving target: whoever controls the action can point it at new
      # code, and the next run executes it unreviewed. Dependabot understands
      # this form and opens a pull request to move the pin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads `packageManager` from package.json, so CI uses the same pnpm
      # version as every developer and the lockfile stays stable.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node 24 is what this project is developed and verified against. The
      # `engines` floor in package.json stays where upstream puts it, because
      # that floor is a promise to consumers rather than a target for us.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm deps:check

  e2e:
    name: scaffold, install and build for Android
    runs-on: ubuntu-latest
    steps:
      # Same pins as the job above, for the same reason: a tag is a moving target.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      # The scaffolded app is a React Native project, so its Android build wants
      # the JDK that framework documents rather than whichever one the image
      # happens to ship.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Scaffolds into a temporary directory, installs the app there, checks the
      # linked packages and the help text, bundles both platforms with Metro, then
      # builds the Android app. This is the only check that runs a scaffolded app
      # for real, and it exists because four scaffolder faults were invisible
      # until an app was installed. The bundle runs first and is the cheap half of
      # it: Metro needs no native toolchain and takes seconds, while compiling
      # native code never runs Metro at all, which is how the template once shipped
      # without the package the SFC transform writes into every component.
      - run: node scripts/e2e-scaffold.mjs --bundle --build android

  e2e-ios:
    name: scaffold, install and build for iOS
    # A macOS runner costs several times a Linux one and the build takes minutes,
    # so iOS is verified on main and on demand rather than on every pull request.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      # Same pins as the verify job, for the same reason.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      # CocoaPods turns the app's Podfile into the workspace the build needs, and
      # the runner images do not always ship a usable one.
      - run: pod --version || sudo gem install cocoapods --no-document

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/e2e-scaffold.mjs --build ios

  journey-android:
    name: run the shared journey on an emulator
    runs-on: ubuntu-latest
    # The step that boots the emulator has no timeout of its own and the default
    # job timeout is six hours, so an emulator that hangs mid-boot costs a
    # runner for the afternoon instead of failing in the time a journey takes.
    timeout-minutes: 30
    steps:
      # Same pins as the verify job, for the same reason.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # A hosted runner has /dev/kvm but the runner user is not in its group, and
      # the emulator without acceleration is worse than slow: it never finishes
      # booting. The action notices, sets `-accel off`, and the run dies on
      # `Can't find service: package` while adb already lists the device. This is
      # the recipe from the action's own README, and the reason it recommends an
      # Ubuntu runner over a macOS one.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The journey drives an app that is already built: `detox test` installs
      # and runs a binary, it does not compile one. Building here rather than
      # inside the emulator step also keeps the emulator step to the run itself,
      # which is the part that can hang.
      - run: pnpm --filter vue-basic e2e:build:android

      # This job owns the emulator end to end rather than handing it to the
      # maintained helper action, which is deliberate. That action deadlocks
      # after the tests pass: it kills the emulator, then waits on the whole
      # process tree, and the emulator's own crash-handler children never exit
      # (ReactiveCircus/android-emulator-runner#385, open since 2024 and still
      # reproducing as of this writing). The suite goes green and the job hangs
      # anyway, and no later step can clean up, because the hung step holds the
      # workflow until the job timeout. Booting the emulator here means nothing
      # waits on something we do not control, and the teardown below is a trap
      # that runs whatever the tests did.
      #
      # The profile is load-bearing rather than cosmetic: the canary is a fixed
      # column whose list takes the height the card leaves, so a small AVD
      # starves the list to zero height and the list journey fails on the device
      # profile instead of on the code. A phone-sized AVD is part of the setup.
      - name: Run the journey against the emulator
        env:
          NAVIROX_ANDROID_AVD: navirox-e2e
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          # The trap is the teardown for every outcome below. Killing qemu and
          # the crash handler with -9 is what makes the step end: a polite
          # shutdown leaves the handler behind, and this shell is the only
          # process left to notice.
          teardown() {
            adb emu kill > /dev/null 2>&1 || true
            sleep 5
            pkill -9 -f qemu-system || true
            pkill -9 -f crashpad_handler || true
          }
          trap teardown EXIT

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64" > /dev/null
          echo no | avdmanager create avd --force -n "$NAVIROX_ANDROID_AVD" \
            --package "system-images;android-35;google_apis;x86_64" --device pixel_7

          # Output goes to a file so the emulator does not hold the step's pipe
          # open, and it outlives this shell only until the trap above.
          emulator -avd "$NAVIROX_ANDROID_AVD" -no-window -gpu swiftshader_indirect \
            -no-snapshot -noaudio -no-boot-anim > /tmp/emulator.log 2>&1 &

          adb wait-for-device
          for _ in $(seq 1 150); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            sleep 2
          done
          adb shell getprop sys.boot_completed | tr -d '\r' | grep -q 1

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          pnpm --filter vue-basic e2e:test:android || {
            tail -n 50 /tmp/emulator.log
            exit 1
          }

  journey-ios:
    name: run the shared journey on a simulator
    # Same reasoning as the iOS build job above: a macOS runner costs several
    # times a Linux one, so the journey is verified on main and on demand.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    # The first launch on a fresh runner boots a simulator, installs the app and
    # builds a Metro bundle from an empty cache, which is minutes before the first
    # assertion. Without a cap, a stuck simulator waits out the six-hour default.
    timeout-minutes: 45
    steps:
      # Same pins as the verify job, for the same reason.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      # Detox reaches into the simulator through applesimutils, which is not in
      # the runner image. Without it the suite dies before the first test with a
      # bare "applesimutils: command not found", which reads like a Detox fault
      # and is not one. It lives in the Wix tap, which Homebrew refuses to load
      # until it is trusted.
      - run: brew tap wix/brew && brew trust wix/brew && brew install applesimutils

      - run: pod --version || sudo gem install cocoapods --no-document

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Pods are not committed, and adding a devDependency is enough to move the
      # lock the build checks the manifest against.
      - run: pod install
        working-directory: examples/vue-basic/ios

      - run: pnpm --filter vue-basic e2e:build:ios
      - run: pnpm --filter vue-basic e2e:test:ios
